<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>m1une</title>
  <meta
    name="description"
    content="Projects and resources created by m1une."
  >

  <style>
    :root {
      color-scheme: light dark;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 64px 24px;
      line-height: 1.6;
    }

    header {
      margin-bottom: 48px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2.5rem;
    }

    .subtitle {
      margin-top: 0;
      opacity: 0.75;
    }

    .projects {
      display: grid;
      gap: 16px;
    }

    .card {
      display: block;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      border-radius: 12px;
      transition:
        transform 0.15s,
        border-color 0.15s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: currentColor;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .card p {
      margin-bottom: 0;
      opacity: 0.75;
    }

    footer {
      margin-top: 64px;
      font-size: 0.9rem;
      opacity: 0.65;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>

<body>
  <header>
    <h1>m1une</h1>
    <p class="subtitle">
      Competitive programming libraries and other projects.
    </p>
  </header>

  <main>
    <h2>Projects</h2>

    <div class="projects">
      <a class="card" href="/m1une_library/">
        <h2>Competitive Programming Library</h2>
        <p>
          A verified C++ library containing algorithms and data structures
          for competitive programming.
        </p>
      </a>
    </div>
  </main>

  <footer>
    <a href="https://github.com/m1une">GitHub</a>
  </footer>
</body>
</html>
